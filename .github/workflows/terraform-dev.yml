name: 'Terraform Deploy Dev'

on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  contents: read

jobs:
  terraform:
    name: 'Deploy Terraform Dev'
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: development

    defaults:
      run:
        shell: bash
        working-directory: ./infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS Credentials and Environment Variables
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV


      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=back_end_state_file/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -upgrade

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false -var "region=${{ env.AWS_REGION }}" -var "account_id=${{ env.AWS_ACCOUNT_ID }}" -var "environment=dev"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var "region=${{ env.AWS_REGION }}" -var "account_id=${{ env.AWS_ACCOUNT_ID }}" -var "environment=dev"

      - name: Extract Terraform Outputs
        id: terraform-outputs
        run: |
          DB_ENDPOINT=$(terraform output -raw db_endpoint)
          DB_NAME=$(terraform output -raw db_name)
          DB_PORT=$(terraform output -raw db_port)
          SECRET_ARN=$(terraform output -raw db_user_secret_arn)
          
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> $GITHUB_OUTPUT
          echo "DB_NAME=$DB_NAME" >> $GITHUB_OUTPUT
          echo "DB_PORT=$DB_PORT" >> $GITHUB_OUTPUT
          echo "SECRET_ARN=$SECRET_ARN" >> $GITHUB_OUTPUT
          
          echo "Database endpoint: $DB_ENDPOINT"
          echo "Database name: $DB_NAME"
          echo "Database port: $DB_PORT"

      - name: Get Database Credentials from Secrets Manager
        id: db-credentials
        run: |
          SECRET_VALUE=$(aws secretsmanager get-secret-value \
            --secret-id ${{ steps.terraform-outputs.outputs.SECRET_ARN }} \
            --query SecretString --output text)
          
          # Parse JSON using Python instead of jq to avoid dependency issues
          DB_USERNAME=$(echo "$SECRET_VALUE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['username'])")
          DB_PASSWORD=$(echo "$SECRET_VALUE" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['password'])")

          # Monta URL no formato psycopg3
          DATABASE_URL="postgresql+psycopg2://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
          
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_OUTPUT
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Run Database Migrations
        env:
          DB_ENDPOINT: ${{ steps.terraform-outputs.outputs.DB_ENDPOINT }}
          DB_NAME: ${{ steps.terraform-outputs.outputs.DB_NAME }}
          DB_PORT: ${{ steps.terraform-outputs.outputs.DB_PORT }}
          SECRET_ARN: ${{ steps.terraform-outputs.outputs.SECRET_ARN }}
        run: |
          echo "🧪 Running database migrations via Lambda..."
          
          # Get the migration lambda function name from terraform outputs
          MIGRATION_LAMBDA_NAME=$(terraform output -raw migration_lambda_function_name)
          echo "Migration Lambda Function: $MIGRATION_LAMBDA_NAME"
          
          # Create payload for lambda invocation and encode as base64
          PAYLOAD_JSON="{\"db_host\":\"$DB_ENDPOINT\",\"db_name\":\"$DB_NAME\",\"db_port\":\"$DB_PORT\",\"secret_arn\":\"$SECRET_ARN\"}"
          echo "📋 Lambda payload: $PAYLOAD_JSON"
          
          # Encode payload as base64
          PAYLOAD_BASE64=$(echo -n "$PAYLOAD_JSON" | base64 -w 0)
          
          # Invoke the migration lambda
          echo "🚀 Invoking migration lambda..."
          LAMBDA_INVOKE_RESULT=$(aws lambda invoke \
            --function-name "$MIGRATION_LAMBDA_NAME" \
            --payload "$PAYLOAD_BASE64" \
            --output text \
            --query 'StatusCode' \
            /tmp/lambda-response.json)
          
          # Check lambda invocation status
          if [ "$LAMBDA_INVOKE_RESULT" = "200" ]; then
            echo "✅ Lambda invocation successful"
            
            # Show lambda response
            echo "📋 Lambda response:"
            cat /tmp/lambda-response.json | python3 -m json.tool
            
            # Parse lambda response to get statusCode and body
            LAMBDA_STATUS_CODE=$(cat /tmp/lambda-response.json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('statusCode', 500))")
            
            echo "Lambda response statusCode: $LAMBDA_STATUS_CODE"
            
            # Check if lambda execution was successful (statusCode = 200)
            if [ "$LAMBDA_STATUS_CODE" = "200" ]; then
              echo "🎉 Database migrations completed successfully!"
              
              # Extract body content for additional information
              LAMBDA_BODY=$(cat /tmp/lambda-response.json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('body', ''))")
              echo "Migration details: $LAMBDA_BODY"
              
              # Parse body to get status and revision information
              MIGRATION_STATUS=$(echo "$LAMBDA_BODY" | python3 -c "import sys, json; data=json.loads(sys.stdin.read()); print(data.get('status', 'unknown'))")
              CURRENT_REVISION=$(echo "$LAMBDA_BODY" | python3 -c "import sys, json; data=json.loads(sys.stdin.read()); print(data.get('current_revision', 'unknown'))")
              
              echo "Migration status: $MIGRATION_STATUS"
              echo "Current revision: $CURRENT_REVISION"
              
            else
              echo "❌ Database migrations failed! Lambda returned statusCode: $LAMBDA_STATUS_CODE"
              echo "Lambda response details:"
              cat /tmp/lambda-response.json
              exit 1
            fi
          else
            echo "❌ Lambda invocation failed with invoke status: $LAMBDA_INVOKE_RESULT"
            cat /tmp/lambda-response.json
            exit 1
          fi