name: 'Terraform Deploy Dev'

on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  contents: read

jobs:
  terraform:
    name: 'Deploy Terraform Dev'
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: development

    defaults:
      run:
        shell: bash
        working-directory: ./infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS Credentials and Environment Variables
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV


      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=back_end_state_file/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -upgrade

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false -var "aws_region=${{ secrets.AWS_REGION }}" -var "aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" -var "environment=dev" -var "ses_from_email=${{ vars.AWS_SES_FROM_EMAIL }}" -var "ia_consumer_api_url=${{ vars.IA_CONSUMER_API_URL }}" -var "ia_consumer_api_key=${{ secrets.IA_CONSUMER_API_KEY }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var "aws_region=${{ secrets.AWS_REGION }}" -var "aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}" -var "environment=dev" -var "ses_from_email=${{ vars.AWS_SES_FROM_EMAIL }}" -var "ia_consumer_api_url=${{ vars.IA_CONSUMER_API_URL }}" -var "ia_consumer_api_key=${{ secrets.IA_CONSUMER_API_KEY }}"